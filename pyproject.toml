[project]
name = "agentextractor"
version = "0.1.0"
description = "description"
readme = "README.md"
authors = [
    { name = "ogustavolopezv", email = "ogustavo.lopezv@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg>=1.4",
    "ipython>=9.17.1",
    "langchain-community>=0.4.2",
    "langchain[ollama]>=1.4.0",
    "openai-whisper>=20250625",
    "pillow>=12.3.0",
    "pydub>=0.25.1",
]

[project.scripts]
agentextractor = "agentextractor:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
